<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA84A" />
      <stop offset="45%" stop-color="#F47B20" />
      <stop offset="100%" stop-color="#E25816" />
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#F47B20" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#F47B20" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#F47B20" stroke-width="1.8" stroke-opacity="0.45" />

  <!-- Ambient Radial Glow in Center -->
  <circle cx="32" cy="33" r="22" fill="url(#auraGlow)" />

  <!-- Bold Modern Monogram A -->
  <path d="M32 13 L46 47 H38.8 L35.6 39 H28.4 L25.2 47 H18 Z M32 23.2 L29.5 33.2 H34.5 Z" fill="url(#accentGrad)" filter="url(#softGlow)" />

  <!-- Sparkling Star Accent (Top-Right) -->
  <path d="M48 11 Q48 16 53 16 Q48 16 48 21 Q48 16 43 16 Q48 16 48 11 Z" fill="#FFE0B2" />
  <circle cx="48" cy="16" r="1.2" fill="#FFFFFF" />
</svg>